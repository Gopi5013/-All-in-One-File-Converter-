<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>{% block title %}Document Tools{% endblock %}</title>
    <meta name="description" content="A simple home for practical PDF and image tools.">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous">
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css', v=config['STATIC_ASSET_VERSION']) }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Main navigation">
        <a class="brand" href="{{ url_for('main.index') }}" aria-label="Document Tools home">
          <span>Document <span class="brand-accent">Tools</span></span>
        </a>
        <div class="nav-links" id="primary-navigation">
          <a href="{{ url_for('main.index') }}#tools">Explore tools</a>
        </div>
      </nav>
    </header>

    {% block content %}{% endblock %}
    <script
      src="{{ url_for('static', filename='js/app.js', v=config['STATIC_ASSET_VERSION']) }}"
      defer></script>
  </body>
</html>
